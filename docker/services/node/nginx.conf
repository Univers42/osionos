# The app shell's script policy, defined once; every add_header below names it (#314). Report-Only
# until a three-engine sweep shows 0 violations. The two sha256 sources are index.html's two inline
# scripts (font preload, theme bootstrap before first paint): tests/canvas/app-csp.test.ts fails when
# either changes without this list. 'wasm-unsafe-eval' because the formula engine and the whiteboard
# compile WebAssembly on the main thread; blob: workers match the desktop policy
# (apps/osionos-electron/desktop-guards.js). No 'unsafe-inline' or 'unsafe-eval' in script-src, ever.
# A worker takes its policy from its own response, so the asset locations carry it too.
# The map key is $uri only because nginx wants a source variable: the value never varies.
# frame-src, img-src and style-src are phase 2 (#342): observed here, never enforced with the four
# directives above (scripts/vite/appCsp.ts keeps the two sets apart). `https:` restricts no host:
# the embed sandbox is the control, this only reports http:, data: and blob: frames and http: images.
# http://127.0.0.1:4100 is the user's own machine node (terminal, editor and explorer frames).
# connect-src stays out until its origins are generated from the build's own env.
map $uri $app_csp_report_only {
  default "script-src 'self' 'wasm-unsafe-eval' 'sha256-zFs8nWGv3ghI1k167aSjuCxUvDRE+47zPqHFbeK1ZSs=' 'sha256-W/Xm3tvIVnc9PWwiBzm/dVWCELk5MrvFf1+vuILaK+U='; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-src 'self' https: http://127.0.0.1:4100; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve build-time precompressed .gz when the client supports it (zero
  # CPU at request time); fall back to on-the-fly gzip for anything else.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json image/svg+xml
             application/wasm text/plain application/xml;

  # Two headers, both owned here and nowhere else (#314). Enforced: nobody may frame the app, not
  # even itself: a page embedded in a block can redirect its own frame to this origin, and the SPA
  # would then boot same-origin inside it. Never 'self' or SAMEORIGIN, they admit exactly that frame.
  # Report-Only: the script policy above, observed before it is enforced. groot's edges add their
  # own frame-ancestors only to responses whose upstream sent no policy, so this one is never doubled.
  # nginx drops inherited add_header lines in any location that declares its own, so every
  # location below repeats all three (tests/canvas/app-csp.test.ts fails when one forgets).
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy-Report-Only $app_csp_report_only always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must revalidate on every load so hashed-asset deploys roll out
  # immediately; the assets themselves are immutable below.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy-Report-Only $app_csp_report_only always;
  }

  # The worker script is not a hashed asset: cached for a year, a browser never asked for the
  # copy that fixed it (2026-11-16). This exact match outranks the asset rule below.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy-Report-Only $app_csp_report_only always;
  }

  # A deploy replaces the image, and with it every chunk a tab still open on the previous build
  # lazy-loads next (#313). groot's app.Dockerfile (40-keep-assets.sh) keeps the last builds'
  # files in a volume at /var/lib/osionos-kept/assets; a file this build lacks is looked up there.
  # ^~ keeps the regex below and `location /` out: a missing file is a 404, never index.html (a
  # missing .ttf used to answer the app page, which the service worker then kept as the font).
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy-Report-Only $app_csp_report_only always;
    try_files $uri @kept;
  }

  location @kept {
    root /var/lib/osionos-kept;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy-Report-Only $app_csp_report_only always;
    try_files $uri =404;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy-Report-Only $app_csp_report_only always;
    try_files $uri =404;
  }
}
