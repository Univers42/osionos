server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve build-time precompressed .gz when the client supports it (zero
  # CPU at request time); fall back to on-the-fly gzip for anything else.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/javascript text/css application/json image/svg+xml
             application/wasm text/plain application/xml;

  # Nobody may frame the app, not even itself: a page embedded in a block can redirect its
  # own frame to this origin, and the SPA would then boot same-origin inside it. Never 'self'
  # or SAMEORIGIN, they admit exactly that frame. nginx drops inherited add_header lines in
  # any location that declares its own, so the pair is repeated below in each of them.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must revalidate on every load so hashed-asset deploys roll out
  # immediately; the assets themselves are immutable below.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }
}
