<!doctype html>
<html lang="en" data-theme="light" data-palette="warm">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="osionos-build" content="%VITE_APP_VERSION%" />
		<title>osionos — Notion-style workspace & block editor</title>
		<meta
			name="description"
			content="osionos is a fast, Notion-style workspace with a real-time block editor, rich Markdown engine, databases, and collaborative pages."
		/>
		<meta name="theme-color" content="#F2F0EC" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/favicon.svg" />
		<!-- Start both text fonts at HTML-parse time. A <link rel="preload"> is only
		     "used" once text paints in that font, and the body is empty until the app
		     bundle runs: on a slow link that is past Firefox's few-second window, so it
		     warned "preloaded but not used". document.fonts.load() fetches through
		     the @font-face rule itself, so there is nothing to go unused. @font-face is
		     also in global.css; Newsreader is the serif page title on every page. -->
		<style>
			@font-face{font-family:"Inter Variable";font-style:normal;font-weight:100 900;font-display:swap;src:url("/fonts/inter-latin-wght-normal.woff2") format("woff2")}
			@font-face{font-family:"Newsreader";font-style:normal;font-weight:200 800;font-display:swap;src:url("/fonts/newsreader-latin-wght-normal.woff2") format("woff2")}
			html,body{font-family:"Inter Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
		</style>
		<script>
			if (document.fonts) ['1em "Inter Variable"', '1em Newsreader'].forEach(function (f) { document.fonts.load(f).catch(function () {}); });
		</script>
		<!-- Appearance bootstrap: apply the stored light/dark mode, color palette and
		     personal appearance (accent, density, corners, text size, and the
		     accessibility choices: link underlines, motion, animated images,
		     hovercards, and the page outline / properties switches) BEFORE first paint so there is no flash of the default
		     theme. Mirrors src/shared/config/theme.ts; App.tsx re-validates and
		     re-applies on mount (an unknown accent id set here is dropped there). -->
		<script>
			(function () {
				try {
					var root = document.documentElement, ds = root.dataset;
					var m = localStorage.getItem('osionos:theme-mode');
					ds.theme = (m === 'light' || m === 'dark') ? m
						: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
					var p = localStorage.getItem('osionos:palette');
					if (p) ds.palette = p;
					var a = JSON.parse(localStorage.getItem('osionos:appearance')) || {};
					// Every axis lists its non-default values: at the default the
					// attribute stays absent, so a person who never chose one carries
					// nothing. (urlPaste has no attribute: it changes what a paste does.)
					var axes = { density: ['compact'], radius: ['sharp', 'round'], uiScale: ['small', 'large'],
						linkUnderline: ['always'], motion: ['reduce', 'full'],
						animatedImages: ['system', 'still'], hovercards: ['off'],
						pageOutline: ['hide'], pageProperties: ['hide'] };
					for (var k in axes) if (axes[k].indexOf(a[k]) > -1) ds[k] = a[k];
					if (typeof a.accent === 'string' && /^[a-z]+$/.test(a.accent) && a.accent !== 'cobalt') ds.accent = a.accent;
					var h = typeof a.hue === 'number' ? Math.round(a.hue) : -1;
					if (ds.accent === 'custom') root.style.setProperty('--osio-accent-hue', h >= 0 && h <= 359 ? h : 260);
				} catch (e) {}
			})();
			// The active custom theme (src/shared/config/themeApply.ts): its cached
			// `--osio-*` map, filtered as readCompiledTheme filters it, so a tampered
			// cache cannot do more than the app itself could. Skipped by ?theme=safe
			// and by the osio.themes flag at 0/false/off/no in the URL or storage.
			// The palette is checked by shape only; App drops an unknown id on mount.
			(function () {
				try {
					var q = location.search;
					if (/[?&]theme=safe(&|$)/.test(q)) return;
					var f = new URLSearchParams(q).get('osio.themes');
					if (f === null) f = localStorage.getItem('osio.themes');
					if (f !== null && ['0', 'false', 'off', 'no'].indexOf(f.toLowerCase()) > -1) return;
					var t = JSON.parse(localStorage.getItem('osionos:theme-vars'));
					if (!t || t.v !== 1 || !t.vars || typeof t.vars !== 'object') return;
					var root = document.documentElement, ds = root.dataset;
					if (t.base === 'light' || t.base === 'dark') ds.theme = t.base;
					if (typeof t.palette === 'string' && /^[a-z-]{1,32}$/.test(t.palette)) ds.palette = t.palette;
					for (var k in t.vars) {
						var v = t.vars[k];
						if (/^--osio-[a-z0-9-]{1,48}$/.test(k) && typeof v === 'string' && v.length > 0 && v.length <= 160
							&& !/url\(|var\(|expression\(|[;{}<>\\!@]/i.test(v)) root.style.setProperty(k, v);
					}
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/app/main.tsx"></script>
	</body>
</html>
