name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "bugfix/**"
      - "feat/**"
      - "feature/**"
      - "chore/**"
      - "refactor/**"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Write scopes live on the jobs that push (build-image on main, push-bridge-image on
# main/develop): a feature-branch run of any job holds nothing it could tag a package with.
permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/osionos
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to a branch with an open PR into main or develop starts this workflow twice: once for
  # the push (refs/heads/<branch>), once for the PR (refs/pull/<n>/merge). The two concurrency
  # groups differ, so both ran in full, and cancelling one by hand left a red, cancelled run on
  # the PR. The push run now skips its jobs (shown as skipped, not failed): the PR run tests the
  # same commit merged into its base. main and develop always run.
  # Caveat: a PR opened after the push leaves that push run going (duplicate work, never a gap);
  # an API error counts as "no PR", so the push run tests in full.
  pr-dedupe:
    name: Push already tested by an open PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      duplicate: ${{ steps.check.outputs.duplicate }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          duplicate=false
          if [ "$EVENT" = push ] && [ "$BRANCH" != main ] && [ "$BRANCH" != develop ]; then
            open=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json baseRefName \
              -q '[.[] | select(.baseRefName == "main" or .baseRefName == "develop")] | length' 2>/dev/null || echo 0)
            if [ "${open:-0}" -gt 0 ]; then duplicate=true; fi
          fi
          echo "duplicate=$duplicate" | tee -a "$GITHUB_OUTPUT"

  # Every job that builds or pulls an image goes through .github/actions/docker-hub-access
  # first: anonymous Docker Hub pulls from the shared runner IPs hit 429 (run 37990792990).
  build-image:
    name: Build & push Docker image
    needs: pr-dedupe
    if: needs.pr-dedupe.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Docker Hub access (mirror.gcr.io + optional login)
        uses: ./.github/actions/docker-hub-access
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services/node/Dockerfile.prod
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.ref == 'refs/heads/main' }}
          sbom: ${{ github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=osionos-prod
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=osionos-prod,mode=max' || '' }}

  # The bridge image (scripts/bridge-*.mjs, no npm deps) is what groot's beta and release
  # hosts run. Every branch proves the Dockerfile builds; only a push to main or develop
  # pushes, and only that job holds the write scopes. The pushed digest is attested so the
  # host can refuse any image whose Sigstore certificate was not minted by this workflow
  # on that branch (groot ADR 0030, conditions C2/C14/C17).
  build-bridge-image:
    name: Build bridge image
    needs: pr-dedupe
    if: needs.pr-dedupe.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Hub access (mirror.gcr.io + optional login)
        uses: ./.github/actions/docker-hub-access
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}

      # The Dockerfile's base is public.ecr.aws (groot parity); the named context routes that
      # one pull through mirror.gcr.io, where the docker-hub-access mirror does not reach
      # (run 40325175014: "toomanyrequests: Data limit exceeded" from ECR). Caveat: the key
      # must equal the FROM string byte for byte — a retagged base silently goes back to ECR.
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services/bridge/Dockerfile
          build-contexts: |
            public.ecr.aws/docker/library/node:22-bookworm-slim=docker-image://mirror.gcr.io/library/node:22-bookworm-slim
          push: false
          provenance: false
          sbom: false

  push-bridge-image:
    name: Push & attest bridge image
    needs: build-bridge-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      BRIDGE_IMAGE: ghcr.io/${{ github.repository_owner }}/osionos-bridge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Hub access (mirror.gcr.io + optional login)
        uses: ./.github/actions/docker-hub-access
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BRIDGE_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      # provenance/sbom off: the attest step below is the single signer, and the host
      # verifies exactly one predicate type.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services/bridge/Dockerfile
          build-contexts: |
            public.ecr.aws/docker/library/node:22-bookworm-slim=docker-image://mirror.gcr.io/library/node:22-bookworm-slim
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.BRIDGE_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  quality:
    name: quality (${{ matrix.scope }})
    needs: pr-dedupe
    if: needs.pr-dedupe.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [root, markengine-submodule]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Docker Hub access (mirror.gcr.io + optional login)
        uses: ./.github/actions/docker-hub-access
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build dev image
        if: matrix.scope == 'root'
        run: |
          docker compose -f docker-compose.base.yml -f docker-compose.dev.yml \
            build playground

      - name: Build MarkEngine image
        if: matrix.scope == 'markengine-submodule'
        run: |
          docker buildx build \
            --build-context public.ecr.aws/docker/library/node:24-alpine=docker-image://node:24-alpine \
            --target build packages/markdown-engine

      - name: Setup Node.js for MarkEngine benchmarks
        if: matrix.scope == 'markengine-submodule'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/markdown-engine/package-lock.json

      - name: Run MarkEngine tests & benchmark guard
        if: matrix.scope == 'markengine-submodule'
        working-directory: packages/markdown-engine
        run: |
          npm ci
          npm test
          npm run bench:ci

      # Types and lint, plus the package-boundary and token guards that used to
      # run only on a developer's machine: the same gate as `npm run test:quality`.
      - name: Quality gate
        if: matrix.scope == 'root'
        run: make quality

      - name: Canvas unit tests
        if: matrix.scope == 'root'
        run: make test-canvas

      # The bridge holds the service-role key; its SSRF guard (tests/bridge/bridge-unfurl-*)
      # and the Dockerfile closure check must fail the build, not only a developer's run.
      - name: Bridge tests
        if: matrix.scope == 'root'
        run: make test-bridge

      # The object-database sync runs after every edit and on every load; its budgets
      # fail the O(databases x rows) loops it replaced (numbers in the bench file).
      - name: Object-database sync bench
        if: matrix.scope == 'root'
        run: make test-bench BENCH=tests/bench/object-database-sync.bench.ts

      - name: SonarQube scan
        if: matrix.scope == 'root' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: make sonar

  # The AI service (services/osionos-ai) has its own suite: a throwaway Postgres and Redis,
  # the groot models migrations, node --test. Until 2026-10-26 no CI job ran it — the service
  # shipped on local gates only — so a green check here is the first proof the service works.
  # scripts/ci.sh is the same command a developer runs.
  ai-service:
    name: AI service (tsc + suite)
    needs: pr-dedupe
    if: needs.pr-dedupe.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Hub access (mirror.gcr.io + optional login)
        uses: ./.github/actions/docker-hub-access
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Install, type-check and run the service suite
        run: sh services/osionos-ai/scripts/ci.sh

  # The E2E suite is 421 tests. A single ubuntu-latest runner (4 vCPU) chews through it at
  # ~6 tests/min, i.e. ~70 min — it never fit the old 30-min single job (it was killed at
  # test ~174). It is split across 6 shards so each runs ~70 tests in ~12 min.
  # `test-gate` below is the single required check: it fails unless EVERY shard succeeded,
  # so a shard that silently doesn't run can't be mistaken for a pass.
  test:
    name: Browser tests (shard ${{ matrix.shard }}/6)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CI: "1"
      # 2, not 3: on a 4-vCPU runner the Vite dev server + N Chromium workers contend for the
      # same cores. 3 workers starved each test (measured median 26.5s against the 30s test
      # timeout — a coin flip). 2 workers keeps throughput and restores real headroom.
      TEST_WORKERS: 2
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}/6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Docker Hub access (mirror.gcr.io + optional login)
        uses: ./.github/actions/docker-hub-access
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run browser E2E suite
        run: |
          docker compose -f docker-compose.base.yml -f docker-compose.dev.yml up -d --wait mongodb
          make test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # The legacy second brain gate defaults OFF, so the default shards already run the
  # graph_render suite (tests/e2e/graph-studio-off). This job builds with the gate ON
  # (the developer backup) and runs the specs that need the legacy view; playwright.config
  # ignores them in a default build.
  test-legacy-on:
    name: Browser tests (gate on, legacy second brain)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      TEST_WORKERS: 2
      VITE_LEGACY_SECOND_BRAIN: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Docker Hub access (mirror.gcr.io + optional login)
        uses: ./.github/actions/docker-hub-access
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run the gate-on legacy second brain specs
        run: |
          docker compose -f docker-compose.base.yml -f docker-compose.dev.yml up -d --wait mongodb
          docker compose -f docker-compose.base.yml -f docker-compose.dev.yml run --rm --no-deps \
            browser-tests pnpm exec playwright test \
              tests/e2e/legacy-second-brain-gate.spec.mjs \
              tests/e2e/legacy-graph-engine-audit.spec.mjs \
              tests/e2e/legacy-graph-engine-visual.spec.mjs \
              tests/e2e/legacy-graph-semantic-zoom.spec.mjs

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-legacy-on
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # The default build has no bridge URL, so the framed-handoff consume and the public-page fetch
  # never run there and a test of either would pass vacuously. This job builds with a stub bridge
  # URL and runs only tests/e2e/bridge-stub, whose specs answer that host themselves.
  test-bridge-stub:
    name: Browser tests (stub bridge URL)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      TEST_WORKERS: 2
      PLAYWRIGHT_BRIDGE_STUB: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Docker Hub access (mirror.gcr.io + optional login)
        uses: ./.github/actions/docker-hub-access
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run the stub-bridge specs
        run: |
          docker compose -f docker-compose.base.yml -f docker-compose.dev.yml up -d --wait mongodb
          docker compose -f docker-compose.base.yml -f docker-compose.dev.yml run --rm --no-deps \
            browser-tests pnpm exec playwright test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-bridge-stub
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # The production bundle (Dockerfile.prod's builder stage) must hold no legacy second brain
  # when built by default, and must still hold it when built with the gate ON: the ON build
  # is the control that proves the grep would see the legacy code if it were there.
  bundle-legacy-gate:
    name: Bundle legacy second brain (gate ${{ matrix.gate == 'true' && 'on' || 'default' }})
    needs: pr-dedupe
    if: needs.pr-dedupe.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate: ["", "true"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Docker Hub access (mirror.gcr.io + optional login)
        uses: ./.github/actions/docker-hub-access
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build the production bundle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services/node/Dockerfile.prod
          target: builder
          load: true
          push: false
          tags: osionos-bundle:ci
          build-args: VITE_LEGACY_SECOND_BRAIN=${{ matrix.gate }}
          cache-from: type=gha,scope=osionos-prod

      - name: Count legacy second brain strings in the bundle
        env:
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          # The needles, as groot's tests/graph-studio/second-brain.bats: two legacy strings
          # and the graph_render host's meta name. Each exists in source, so a zero below is
          # not vacuous.
          grep -rq 'osio-sb-graph-snapshot' src/features/legacy-second-brain
          grep -rq 'osio-graph__fg' packages/legacy-graph-engine/src
          grep -rq 'graph-studio-base' src/features/graph-studio
          # Plain node in the builder image walks the bundle (its busybox grep has no
          # --include); a missing build dir fails the step instead of reading as 0 matches.
          out=$(docker run --rm -v "$PWD/scripts:/checks:ro" --entrypoint node osionos-bundle:ci \
            /checks/count-bundle-strings.mjs build osio-sb-graph-snapshot osio-graph__fg graph-studio-base)
          echo "gate=${GATE:-unset}: $out"
          files=$(jq -e '.files' <<<"$out")
          legacy=$(jq -e '.counts["osio-sb-graph-snapshot"] + .counts["osio-graph__fg"]' <<<"$out")
          host=$(jq -e '.counts["graph-studio-base"]' <<<"$out")
          test "$files" -gt 0
          if [ "$GATE" = "true" ]; then
            test "$legacy" -gt 0
          else
            test "$legacy" -eq 0
            test "$host" -gt 0
          fi

  # Single required status for the whole sharded suite. `needs.test.result` is the AGGREGATE
  # of the matrix: it is only 'success' when all 6 shards succeeded. A skipped or cancelled
  # shard is therefore a failure here, not a silent pass.
  test-gate:
    name: Browser tests
    needs: [pr-dedupe, test, test-legacy-on, test-bridge-stub, bundle-legacy-gate]
    if: always() && needs.pr-dedupe.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard, the gate-on job, the stub-bridge job and the bundle check to have succeeded
        env:
          SHARDS_RESULT: ${{ needs.test.result }}
          GATE_ON_RESULT: ${{ needs.test-legacy-on.result }}
          BRIDGE_STUB_RESULT: ${{ needs.test-bridge-stub.result }}
          BUNDLE_RESULT: ${{ needs.bundle-legacy-gate.result }}
        run: |
          echo "shards: $SHARDS_RESULT; gate-on legacy: $GATE_ON_RESULT; stub bridge: $BRIDGE_STUB_RESULT; bundle legacy gate: $BUNDLE_RESULT"
          test "$SHARDS_RESULT" = "success"
          test "$GATE_ON_RESULT" = "success"
          test "$BRIDGE_STUB_RESULT" = "success"
          test "$BUNDLE_RESULT" = "success"
