name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "bugfix/**"
      - "feat/**"
      - "feature/**"
      - "chore/**"
      - "refactor/**"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/osionos
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services/node/Dockerfile.prod
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=osionos-prod
          cache-to: type=gha,scope=osionos-prod,mode=max

  quality:
    name: quality (${{ matrix.scope }})
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [root, markengine-submodule]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build dev image
        if: matrix.scope == 'root'
        run: |
          docker compose -f docker-compose.base.yml -f docker-compose.dev.yml \
            build playground

      - name: Build MarkEngine image
        if: matrix.scope == 'markengine-submodule'
        run: docker build --target build src/shared/lib/markengine

      - name: Setup Node.js for MarkEngine benchmarks
        if: matrix.scope == 'markengine-submodule'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/shared/lib/markengine/package-lock.json

      - name: Run MarkEngine benchmark guard
        if: matrix.scope == 'markengine-submodule'
        working-directory: src/shared/lib/markengine
        run: |
          npm ci
          npm run bench:ci

      - name: Typecheck
        if: matrix.scope == 'root'
        run: make typecheck

      - name: Lint
        if: matrix.scope == 'root'
        run: make lint

      - name: SonarQube scan
        if: matrix.scope == 'root' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: make sonar

  # The E2E suite is 421 tests. A single ubuntu-latest runner (4 vCPU) chews through it at
  # ~6 tests/min, i.e. ~70 min — it never fit the old 30-min single job (it was killed at
  # test ~174). It is split across 6 shards so each runs ~70 tests in ~12 min.
  # `test-gate` below is the single required check: it fails unless EVERY shard succeeded,
  # so a shard that silently doesn't run can't be mistaken for a pass.
  test:
    name: Browser tests (shard ${{ matrix.shard }}/6)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CI: "1"
      # 2, not 3: on a 4-vCPU runner the Vite dev server + N Chromium workers contend for the
      # same cores. 3 workers starved each test (measured median 26.5s against the 30s test
      # timeout — a coin flip). 2 workers keeps throughput and restores real headroom.
      TEST_WORKERS: 2
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}/6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run browser E2E suite
        run: |
          docker compose -f docker-compose.base.yml -f docker-compose.dev.yml up -d mongodb
          make test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # Single required status for the whole sharded suite. `needs.test.result` is the AGGREGATE
  # of the matrix: it is only 'success' when all 6 shards succeeded. A skipped or cancelled
  # shard is therefore a failure here, not a silent pass.
  test-gate:
    name: Browser tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to have succeeded
        run: |
          echo "shard matrix result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
