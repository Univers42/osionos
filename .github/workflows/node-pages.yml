# The IDE, terminal and editor pages osionos-node serves, prebuilt, so install.sh needs neither pnpm nor
# docker on the machine it runs on. One rolling release: the newest main that built.
name: osionos-node pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: node-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build --config vite.ide.config.ts
      - run: pnpm exec vite build --config vite.terminal.config.ts
      - run: pnpm exec vite build --config vite.editor.config.ts
      - name: Pack
        run: |
          tar -czf osionos-node-pages.tar.gz dist-ide build/terminal build/editor
          sha256sum osionos-node-pages.tar.gz | sed 's/  .*/  pages.tar.gz/' > osionos-node-pages.tar.gz.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view node-pages >/dev/null 2>&1 || \
            gh release create node-pages --title "osionos-node pages" --notes "Built from main by CI." --prerelease
          gh release upload node-pages osionos-node-pages.tar.gz osionos-node-pages.tar.gz.sha256 --clobber
