# Docker Hub access for CI — why this exists:
# On 2026-10-09 every image build of CI run 37990792990 (main) died with
# "node:22-alpine ... 429 Too Many Requests" / "nginx:1.27-alpine ... 429": GitHub's hosted
# runners share egress IPs, and Docker Hub rate-limits anonymous pulls per IP. Nothing in the
# code had changed. Three layers, each one independent of the others:
#   1. the Docker daemon pulls docker.io through mirror.gcr.io (covers `docker compose build`,
#      `docker run`, `docker compose up`);
#   2. the Buildx builder's BuildKit mirrors docker.io the same way (covers
#      `docker buildx build` and docker/build-push-action, which bypass the daemon's config);
#   3. when the org's DOCKER_HUB_USERNAME / DOCKER_HUB_TOKEN secrets are present, pulls that
#      miss the mirror are authenticated instead of anonymous.
# Ponytail: mirror.gcr.io is a pull-through cache — a miss falls back to docker.io and, without
# the login, still counts against the anonymous per-IP limit. Official images stay cached;
# a rarely pulled tag can still 429 on a cold mirror.
name: Docker Hub access
description: Route docker.io pulls through mirror.gcr.io (daemon + BuildKit) and log in to Docker Hub when credentials are provided.

inputs:
  username:
    description: Docker Hub username; the login step is skipped when token is empty.
    required: false
    default: ""
  token:
    description: Docker Hub access token; empty skips the login step with a notice.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Route docker.io pulls through mirror.gcr.io (daemon)
      shell: bash
      run: |
        set -euo pipefail
        cfg=/etc/docker/daemon.json
        sudo mkdir -p /etc/docker
        # Merge, never overwrite: the runner image ships a daemon.json (cgroup-parent for the job).
        if sudo test -s "$cfg"; then sudo cat "$cfg"; else echo '{}'; fi \
          | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
        sudo install -m 0644 "$RUNNER_TEMP/daemon.json" "$cfg"
        sudo systemctl restart docker
        docker info --format 'daemon registry mirrors: {{.RegistryConfig.Mirrors}}'

    - name: Set up Docker Buildx (BuildKit mirrors docker.io too)
      uses: docker/setup-buildx-action@v3
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]

    - name: Log in to Docker Hub
      if: inputs.token != ''
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    - name: No Docker Hub credentials — anonymous pulls through the mirror only
      if: inputs.token == ''
      shell: bash
      run: |
        echo "::notice title=Docker Hub::DOCKER_HUB_USERNAME / DOCKER_HUB_TOKEN are not set for this run; docker.io pulls go through mirror.gcr.io anonymously (a mirror miss still counts against Docker Hub's per-IP limit)."
